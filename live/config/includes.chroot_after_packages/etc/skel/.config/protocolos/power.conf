# ProtocolOS — спящий режим (минуты, от простоя)
# 15 мин: предспящий — блокировка экрана + яркость 70%
# 20 мин: выключение монитора (через 5 мин после предспящего)
# 180 мин (3 ч): полное выключение / сон
presleep_lock=15
presleep_brightness=70
monitor_off=20
full_sleep=180
# suspend | hibernate | shutdown
full_action=suspend
# кнопка VPN в панели: 0 = скрыта и выключена по умолчанию
show_vpn_button=0
